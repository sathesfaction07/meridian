repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  - repo: local
    hooks:
      # The feeds are sample data that the test suite asserts against, so a broken one
      # must not reach a commit.
      - id: feeds-parse
        name: the shipped feeds parse cleanly
        entry: >
          python -c "import sys; sys.path.insert(0, 'src');
          from pathlib import Path;
          from lifecycle_tracker.ingest.feeds import load_directory;
          e, p = load_directory(Path('data/feeds'));
          assert not p, p; print(f'{len(e)} events, 0 problems')"
        language: system
        pass_filenames: false
        files: ^data/feeds/
