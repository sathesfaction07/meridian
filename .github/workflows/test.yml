name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # tzdata explicitly: every DST assertion reads the IANA database, and a slim
        # runner image cannot be assumed to carry it.
        run: |
          pip install tzdata
          pip install -e ".[dev,chart]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=lifecycle_tracker --cov-report=term-missing

      - name: Doctor runs with no credentials and no network
        run: lifecycle-tracker doctor -i data/feeds

      - name: Region offsets are what the docs claim
        run: |
          lifecycle-tracker regions | tee /tmp/regions.txt
          grep -qE '^\s+in .*\+5\.50\s+\+5\.50\s+no' /tmp/regions.txt
          grep -qE '^\s+au .*\+11\.00\s+\+10\.00\s+yes' /tmp/regions.txt
          echo "half-hour offset and inverted southern phase both present"

      - name: A nonexistent local time is flagged, not silently shifted
        run: |
          # Exits 1 by design, so the exit code is inverted here.
          ! lifecycle-tracker resolve 2025-03-09T02:30:00 us
          lifecycle-tracker resolve 2025-03-09T02:30:00 us | grep -q nonexistent
          ! lifecycle-tracker resolve 2025-11-02T01:30:00 us
          lifecycle-tracker resolve 2025-11-02T01:30:00 us | grep -q ambiguous
          echo "both DST edge cases reported"

      - name: The shipped feeds behave as documented
        run: |
          # Non-zero is expected: the sample feeds carry deliberate conflicts.
          lifecycle-tracker show -i data/feeds --no-details -o /tmp/ci-out || true
          python -c "
          import json
          summary = json.load(open('/tmp/ci-out/report.json'))['summary']
          # 31 raw rows, 2 of them duplicates reported by both a regional and the
          # global feed, so 29 unique events and one span per event.
          assert summary['products'] == 3, summary
          assert summary['events'] == 29, summary
          assert summary['spans'] == 29, summary
          assert summary['regions'] == 10, summary
          assert summary['duplicates_removed'] == 2, summary
          assert summary['dst_ambiguous'] == 3, summary
          assert summary['dst_nonexistent'] == 4, summary
          assert summary['conflicts'] == 7, summary
          print('feeds:', summary)
          "

      - name: An exported file can be read back in
        # The regression: the exporter wrote `instant` while the importer only accepted
        # `timestamp`, so every row was rejected. Each half worked; the round trip did not.
        run: |
          lifecycle-tracker export-all -i data/feeds -o /tmp/ci-first
          lifecycle-tracker export-all -i /tmp/ci-first/events.csv -o /tmp/ci-second
          python -c "
          import json
          first = json.load(open('/tmp/ci-first/report.json'))['summary']
          second = json.load(open('/tmp/ci-second/report.json'))['summary']
          assert first['events'] == second['events'], (first, second)
          assert first['spans'] == second['spans'], (first, second)
          print('round trip:', second['events'], 'events,', second['spans'], 'spans')
          "

      - name: JSON Lines on stdout carries only data, so it can be piped
        run: |
          lifecycle-tracker jsonl -i data/feeds --what spans > /tmp/spans.jsonl
          python -c "
          import json
          lines = [l for l in open('/tmp/spans.jsonl') if l.strip()]
          assert lines, 'no output'
          for line in lines:
              json.loads(line)
          print(len(lines), 'span lines, all valid JSON')
          "

  test-windows:
    # The Linux job runs the full suite plus this project's own checks. This job runs the
    # test suite on Windows, where the default encoding is cp1252 and paths use backslashes:
    # several projects in this portfolio shipped bugs that only failed there.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install tzdata
          pip install -e ".[dev,chart]"

      - name: Test
        run: pytest -q
